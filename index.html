<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Fixanycars | Pre-Purchase Inspection Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root{
    --black:#0d0d0d;
    --near-black:#171717;
    --red:#e2001a;
    --red-dark:#b40015;
    --white:#ffffff;
    --grey-50:#f6f6f7;
    --grey-100:#eeeeef;
    --grey-200:#e2e2e4;
    --grey-400:#a8a8ac;
    --grey-600:#6c6c72;
    --grey-800:#2b2b2e;
    --pass:#1b8a3a;
    --pass-bg:#e7f6ec;
    --fail:#e2001a;
    --fail-bg:#fdeaec;
    --na-bg:#eeeeef;
    --na:#6c6c72;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; touch-action:manipulation;}
  body{
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--grey-50);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif; letter-spacing:.02em; text-transform:uppercase;}

  /* ---------- App shell ---------- */
  .app{display:flex; min-height:100vh;}
  .rail{
    width:245px; flex:0 0 245px; background:var(--black); color:var(--white);
    position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 0 18px;
  }
  .rail-brand{display:flex; align-items:center; justify-content:center; padding:0 16px 18px; border-bottom:1px solid #262626;}
  .logo-box{
    background:#ffffff;
    border-radius:8px;
    padding:6px 10px 4px 10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .logo-box img, .logo-box svg{
    height:30px;
    width:auto;
    max-width:100%;
    object-fit:contain;
    display:block;
  }

  .rail nav{padding:14px 10px;}
  .rail a{
    display:flex; align-items:center; gap:10px; padding:9px 12px; margin:2px 0; border-radius:9px;
    color:#c9c9cc; text-decoration:none; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .rail a .n{
    width:20px; height:20px; border-radius:50%; background:#262626; color:#9a9a9e;
    display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; flex:0 0 20px;
  }
  .rail a:hover{background:#1c1c1c; color:#fff;}
  .rail a.done .n{background:var(--red); color:#fff;}
  .rail-progress{padding:16px 20px 4px;}
  .rail-progress .bar{height:6px; border-radius:4px; background:#262626; overflow:hidden;}
  .rail-progress .bar > i{display:block; height:100%; background:var(--red); width:0%; transition:width .25s;}
  .rail-progress .lbl{font-size:11px; color:#9a9a9e; margin-top:6px; letter-spacing:.03em; text-transform:uppercase;}

  .main{flex:1; min-width:0;}
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--white); border-bottom:1px solid var(--grey-200);
    display:flex; align-items:center; justify-content:space-between; padding:14px 28px;
  }
  .topbar h1{margin:0; font-size:22px; font-weight:700;}
  .topbar .sub{font-size:12px; color:var(--grey-600); text-transform:none; font-family:'Inter'; letter-spacing:0; font-weight:500;}
  .btn{
    border:none; cursor:pointer; font-family:'Inter'; font-weight:700; font-size:13.5px;
    padding:12px 18px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s, box-shadow .12s; min-height:44px; touch-action:manipulation;
  }
  .btn:active{transform:scale(0.98);}
  .btn-red{background:var(--red); color:#fff; box-shadow:0 6px 16px -6px rgba(226,0,26,.55);}
  .btn-red:hover{background:var(--red-dark);}
  .btn-outline{background:#fff; color:var(--black); border:1.5px solid var(--grey-200);}
  .btn-outline:hover{border-color:var(--black);}

  /* Mobile Header & Slide Drawer */
  .mobile-header {
    display: none;
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--black);
    color: #fff;
    padding: 12px 16px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .mobile-header .logo-box {
    padding: 3px 8px 1px;
  }
  .mobile-header .logo-box img, .mobile-header .logo-box svg {
    height: 24px;
  }
  .mobile-menu-btn {
    background: #262626;
    border: none;
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mobile-drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .mobile-drawer-overlay.active { opacity: 1; pointer-events: auto; }
  
  .mobile-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--black);
    z-index: 101; transform: translateX(-100%); transition: transform .25s ease;
    display: flex; flex-direction: column; padding: 20px 0; overflow-y: auto;
  }
  .mobile-drawer.active { transform: translateX(0); }
  .mobile-drawer-close {
    align-self: flex-end; margin: 0 16px 12px; background: #262626; color: #fff;
    border: none; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px;
  }

  .content{max-width:980px; margin:0 auto; padding:26px 28px 90px;}
  section.card{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--grey-100);
    padding:26px 26px 24px; margin-bottom:22px; scroll-margin-top:80px;
  }
  section.card > .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  section.card > .head h2{margin:0; font-size:24px; font-weight:700; display:flex; align-items:center; gap:10px;}
  section.card > .head h2 .tag{
    background:var(--black); color:#fff; font-family:'Inter'; text-transform:none; letter-spacing:0;
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
  }
  .desc{font-size:13px; color:var(--grey-600); margin:-10px 0 18px; font-weight:500;}

  /* meta grid (cover) */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .grid.cols2{grid-template-columns:repeat(2,1fr);}
  .field label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--grey-600); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--grey-200); border-radius:9px; padding:12px 12px; font-size:14px;
    font-family:'Inter'; color:var(--black); background:#fff; outline:none; transition:border-color .12s;
    min-height: 44px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--red);}
  .field textarea{resize:vertical; min-height:80px;}

  .photo-drop{
    border:1.5px dashed var(--grey-200); border-radius:10px; padding:8px; text-align:center; cursor:pointer;
    font-size:12px; color:var(--grey-600); font-weight:600; position:relative; overflow:hidden; min-height:72px;
    display:flex; align-items:center; justify-content:center; background:var(--grey-50); touch-action:manipulation;
    width:100%;
  }
  .photo-drop:hover{border-color:var(--red); color:var(--red);}
  .photo-drop img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:9px;}
  .photo-drop input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}
  .photo-drop .x{position:absolute; top:4px; right:4px; background:rgba(0,0,0,.65); color:#fff; border-radius:50%; width:24px; height:24px; font-size:14px; display:flex; align-items:center; justify-content:center; z-index:2;}

  /* status pill 3-way toggle */
  .status-toggle{display:inline-flex; border-radius:8px; overflow:hidden; border:1.5px solid var(--grey-200); min-height:36px; width:100%;}
  .status-toggle button{
    flex:1; border:none; background:#fff; font-family:'Inter'; font-weight:700; font-size:11px; letter-spacing:.02em;
    padding:6px 4px; cursor:pointer; color:var(--grey-600); text-transform:uppercase; touch-action:manipulation; min-height:34px; text-align:center;
  }
  .status-toggle button + button{border-left:1.5px solid var(--grey-200);}
  .status-toggle button.active.pass{background:var(--pass-bg); color:var(--pass);}
  .status-toggle button.active.fail{background:var(--fail-bg); color:var(--fail);}
  .status-toggle button.active.na{background:var(--na-bg); color:var(--na);}

  /* generic item card used across checklist sections */
  .item{
    border:1px solid var(--grey-100); border-radius:12px; padding:14px; background:var(--grey-50); display:flex; flex-direction:column; justify-content:space-between; gap:10px;
  }
  .item .row1{display:flex; flex-direction:column; gap:8px;}
  .item .row1 .name{font-weight:700; font-size:13.5px; line-height:1.2; color:var(--black);}
  .item .note{margin-top:2px;}
  .item .note textarea{min-height:50px; font-size:13px;}

  /* 5-Column Grid Layout Fix for Tyres & Rims */
  .position-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
  }

  .checklist-strip{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .strip-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--grey-100);
    background:var(--grey-50); border-radius:10px; padding:10px 12px; min-height:48px;
  }
  .strip-item .name{font-size:13px; font-weight:700;}

  .panel-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .damage-chips{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--grey-200); border-radius:20px; padding:6px 10px; font-size:11px; font-weight:700;
    cursor:pointer; color:var(--grey-600); user-select:none; min-height:30px; display:inline-flex; align-items:center;
  }
  .chip.active{background:var(--black); border-color:var(--black); color:#fff;}

  /* Mobile and Tablet responsive overrides */
  @media (max-width:1100px){
    .position-grid{grid-template-columns:repeat(3, 1fr);}
  }

  @media (max-width:880px){
    .rail{display:none;}
    .mobile-header{display:flex;}
    .topbar{flex-direction:column; align-items:flex-start; gap:12px; padding:14px 16px;}
    .topbar > div:last-child{width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
    .topbar .btn{padding:8px 6px; font-size:12px; width:100%; text-align:center;}
    .content{padding:16px 14px 100px;}
    section.card{padding:16px 14px;}
    .grid, .grid.cols2, .position-grid, .panel-grid, .checklist-strip{grid-template-columns:1fr;}
    
    .field input, .field select, .field textarea {
      font-size: 16px !important;
    }
  }

  @media (max-width: 480px) {
    .topbar h1{font-size:18px;}
    .topbar .sub{font-size:11px;}
    .status-toggle button{padding:6px 4px; font-size:10px;}
  }

  /* ---------------- PRINT / PDF REPORT STYLES ---------------- */
  #pdfRoot{ display:none; width:794px; background:#fff; margin:0; padding:0; }
  .pg{ width:794px; height:1123px; padding:0; position:relative; background:#fff; page-break-after:always; break-after:page; overflow:hidden; box-sizing:border-box; }
  .pg-inner{padding:28px 36px 32px;}
  .pg-head{display:flex; align-items:center; justify-content:space-between; padding:14px 36px; border-bottom:2px solid var(--black);}
  .pg-head .brand{display:flex; align-items:center; gap:8px;}
  .pg-head .brand .logo-box{padding:3px 8px 2px; border:1px solid var(--grey-200);}
  .pg-head .brand .logo-box img, .pg-head .brand .logo-box svg{height:20px;}
  .pg-head .doc{font-size:10.5px; color:var(--grey-600); font-weight:600;}
  
  .pg-title-bar{
    background:var(--black); color:#fff; border-radius:8px; padding:8px 14px;
    font-family:'Barlow Condensed'; font-size:16px; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; margin:16px 0 12px;
  }
  .pg-title-bar.red{background:var(--red);}
  .pg-card{background:var(--grey-50); border:1px solid var(--grey-100); border-radius:10px; padding:12px 14px; margin-bottom:12px;}
  
  /* PDF Cover Page */
  .pg-cover{ background:var(--black); color:#fff; text-align:center; padding:0; }
  .pg-cover .cband{padding:48px 40px 20px; display:flex; flex-direction:column; align-items:center;}
  .pg-cover .logo-box{padding:10px 18px 8px; margin-bottom:18px; box-shadow:0 4px 20px rgba(0,0,0,0.4);}
  .pg-cover .logo-box img, .pg-cover .logo-box svg{height:42px;}
  .pg-cover h1{font-size:40px; margin:10px 0 0; font-weight:800; line-height:1.1;}
  .pg-cover h1 i{color:var(--red); font-style:normal;}
  .pg-cover .st{font-size:12px; color:#c9c9cc; margin-top:8px; letter-spacing:.08em; text-transform:uppercase;}
  .pg-cover .veh-photo{width:100%; height:380px; object-fit:cover; margin-top:20px;}
  .pg-cover .cfoot{background:#161616; padding:18px 40px; display:flex; justify-content:space-between; font-size:11.5px; margin-top:auto;}
  
  .pg-grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .pg-grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .pg-grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  
  .pg-kv{font-size:10.5px;}
  .pg-kv .k{color:var(--grey-600); text-transform:uppercase; letter-spacing:.03em; font-weight:700; font-size:9px;}
  .pg-kv .v{font-size:12px; font-weight:700; margin-top:2px; word-break:break-word;}
  
  .pg-pos-card{border:1px solid var(--grey-200); border-radius:8px; padding:8px; background:#fff; display:flex; flex-direction:column; justify-content:space-between;}
  .pg-pos-card .ph{width:100%; height:75px; object-fit:cover; border-radius:6px; background:var(--grey-100); margin-top:6px;}
  .pg-pill{display:inline-block; font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:12px; text-transform:uppercase; text-align:center;}
  .pg-pill.pass{background:var(--pass-bg); color:var(--pass);}
  .pg-pill.fail{background:var(--fail-bg); color:var(--fail);}
  .pg-pill.na{background:var(--na-bg); color:var(--na);}

  /* Symmetrical Suspension Photo Cards in Print */
  .susp-photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
  .susp-photo-card { border: 1px solid var(--grey-200); border-radius: 8px; padding: 6px; background: #fff; text-align: center; }
  .susp-photo-card .lbl { font-size: 10px; font-weight: 700; color: var(--grey-800); margin-bottom: 4px; text-transform: uppercase; }
  .susp-photo-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; display: block; }
  .susp-photo-card .no-ph { width: 100%; height: 110px; background: var(--grey-100); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--grey-400); font-weight: 600; }

  .pg-strip{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  .pg-strip .si{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--grey-100); border-radius:6px; padding:6px 8px; font-size:11px; font-weight:700;}
  .pg-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .pg-photos img{width:100%; height:100px; object-fit:cover; border-radius:6px; border:1px solid var(--grey-100);}
  .pg-comment-line{color:var(--red); font-weight:700; font-size:11.5px; margin-bottom:4px;}
  .pg-overview{background:var(--black); color:#fff; border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:20px; margin-top:10px;}
  .pg-donut{width:80px; height:80px; border-radius:50%; flex:0 0 80px;}
  .pageno{position:absolute; bottom:12px; right:36px; font-size:9.5px; color:var(--grey-600);}

  /* Direct browser printing styling overrides */
  @media print {
    @page {
      size: A4 portrait;
      margin: 0;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      width: 100% !important;
    }
    .rail, .topbar, .mobile-header, .mobile-drawer-overlay, .mobile-drawer, .modal-overlay, .btn {
      display: none !important;
    }
    body.printing-pdf-root .app {
      display: none !important;
    }
    body.printing-pdf-root #pdfRoot {
      display: block !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    body.printing-pdf-root #pdfRoot .pg {
      page-break-before: auto !important;
      break-before: auto !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
    body.printing-pdf-root #pdfRoot .pg:first-child {
      page-break-before: avoid !important;
      break-before: avoid !important;
    }
    body.printing-pdf-root #pdfRoot .pg:last-child {
      page-break-after: auto !important;
      break-after: auto !important;
    }
  }

  /* Modal Dialog Styles */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 99999;
    display: none; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px; padding: 26px; max-width: 440px; width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: modalPop .2s ease-out;
  }
  @keyframes modalPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box h3 { margin: 0 0 10px; font-size: 22px; font-weight: 700; color: var(--black); }
  .modal-box p { font-size: 14px; color: var(--grey-600); margin: 0 0 22px; line-height: 1.45; font-weight: 500; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<!-- Mobile Top Header Bar -->
<div class="mobile-header">
  <div class="logo-box" title="Fixanycars.com">
    <img src="assets/logo.png" alt="Fixanycars Logo" onerror="this.onerror=null; this.src='assets/logo.svg';">
  </div>
  <button class="mobile-menu-btn" onclick="toggleMobileDrawer(true)">
    <span>&#9776;</span> Sections
  </button>
</div>

<!-- Mobile Nav Drawer Overlay -->
<div class="mobile-drawer-overlay" id="mobileDrawerOverlay" onclick="toggleMobileDrawer(false)"></div>
<div class="mobile-drawer" id="mobileDrawer">
  <button class="mobile-drawer-close" onclick="toggleMobileDrawer(false)">&times;</button>
  <div class="rail-progress" style="padding:0 20px 10px;">
    <div class="bar"><i id="mobileProgressBar"></i></div>
    <div class="lbl" id="mobileProgressLbl">0% checked</div>
  </div>
  <nav id="mobileRailNav"></nav>
</div>

<div class="app">
  <!-- ============ LEFT NAV (Desktop) ============ -->
  <aside class="rail">
    <div class="rail-brand">
      <div class="logo-box" title="Fixanycars.com">
        <img src="assets/logo.png" alt="Fixanycars Logo" onerror="this.onerror=null; this.src='assets/logo.svg';">
      </div>
    </div>
    <div class="rail-progress">
      <div class="bar"><i id="progressBar"></i></div>
      <div class="lbl" id="progressLbl">0% checked</div>
    </div>
    <nav id="railNav"></nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Pre-Purchase Inspection</h1>
        <div class="sub">600-Point Comprehensive Vehicle Checklist &mdash; Fixanycars Inspector Console</div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline" onclick="resetForm()">Reset</button>
        <button class="btn btn-outline" onclick="printReport()">&#128438; Print Report</button>
        <button class="btn btn-red" id="pdfBtn" onclick="generatePDF()">&#8595; Download PDF</button>
      </div>
    </div>

    <div class="content" id="formContent"></div>
  </main>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box">
    <h3 id="modalTitle">Notification</h3>
    <p id="modalMsg">Message goes here...</p>
    <div class="modal-actions" id="modalActions">
      <button class="btn btn-red" onclick="closeModal()">OK</button>
    </div>
  </div>
</div>

<!-- hidden root the PDF is rendered into -->
<div id="pdfRoot"></div>

<script>
const LOGO_HTML = `<div class="logo-box" title="Fixanycars.com"><img src="assets/logo.png" alt="Fixanycars Logo" onerror="this.onerror=null; this.src='assets/logo.svg';"></div>`;

const SECTIONS = [
  { id: 'cover', label: 'Cover & Meta' },
  { id: 'tyres', label: 'Tyres' },

function showAlert(title, msg) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalActions').innerHTML = `<button class="btn btn-red" onclick="closeModal()">OK</button>`;
  document.getElementById('customModal').classList.add('active');
}

function showConfirm(title, msg, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalActions').innerHTML = `
    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn btn-red" id="confirmOkBtn">Confirm</button>
  `;
  document.getElementById('confirmOkBtn').onclick = () => {
    closeModal();
    onConfirm();
  };
  document.getElementById('customModal').classList.add('active');
}

function closeModal() {
  document.getElementById('customModal').classList.remove('active');
}

function updateMeta(field, val) {
  state.meta[field] = val;
}

function handlePhoto(input, id) {
  if (input.files && input.files[0]) {
    fileToDataURL(input.files[0], (dataUrl) => {
      setPhotoState(id, dataUrl);
      const dropEl = document.getElementById('drop-' + id);
      if (dropEl) {
        dropEl.innerHTML = `<img src="${dataUrl}"><span class="x" onclick="event.preventDefault();event.stopPropagation();clearPhoto('${id}')">&times;</span><input type="file" accept="image/*" onchange="handlePhoto(this,'${id}')">`;
      }
    });
  }
}

function clearPhoto(id) {
  setPhotoState(id, '');
  const dropEl = document.getElementById('drop-' + id);
  if (dropEl) {
    dropEl.innerHTML = `&#128247; Add photo<input type="file" accept="image/*" onchange="handlePhoto(this,'${id}')">`;
  }
}

function setPhotoState(id, url) {
  const parts = id.split('-');
  if (parts[0] === 'cover') state.meta.coverphoto = url;
  else if (parts[0] === 'tyre') state.tyres[parts[1]].photo = url;
  else if (parts[0] === 'rim') state.rims[parts[1]].photo = url;
  else if (parts[0] === 'brake') state.brakes[parts[1]].photo = url;
  else if (parts[0] === 'susp') {
    if (parts[1] === 'frontFR') state.suspension.front.photoFR = url;
    if (parts[1] === 'frontFL') state.suspension.front.photoFL = url;
    if (parts[1] === 'rearRR') state.suspension.rear.photoRR = url;
    if (parts[1] === 'rearRL') state.suspension.rear.photoRL = url;
  }
  else if (parts[0] === 'intext') state.intext[decodeURIComponent(parts[1])].photo = url;
  else if (parts[0] === 'body') state.body[decodeURIComponent(parts[1])].photo = url;
}

function setStatus(path, status) {
  const keys = path.split('.');
  let obj = state;
  for (let i = 0; i < keys.length - 1; i++) {
    obj = obj[keys[i]];
  }
  obj[keys[keys.length - 1]] = status;
  renderProgress();
  
  const btnGroup = document.querySelectorAll(`[data-path="${path}"]`);
  btnGroup.forEach(btn => {
    btn.classList.remove('active', 'pass', 'fail', 'na');
    if (btn.dataset.val === status) {
      btn.classList.add('active', status);
    }
  });
}

function renderToggle(path, currentVal) {
  return `<div class="status-toggle">
    <button data-path="${path}" data-val="pass" class="${currentVal==='pass'?'active pass':''}" onclick="setStatus('${path}','pass')">Pass</button>
    <button data-path="${path}" data-val="fail" class="${currentVal==='fail'?'active fail':''}" onclick="setStatus('${path}','fail')">Fail</button>
    <button data-path="${path}" data-val="na" class="${currentVal==='na'?'active na':''}" onclick="setStatus('${path}','na')">N/A</button>
  </div>`;
}

function toggleChip(panel, type) {
  const list = state.body[panel].damage;
  const idx = list.indexOf(type);
  if (idx > -1) list.splice(idx, 1);
  else list.push(type);
  
  const chipEl = document.querySelector(`[data-panel="${panel}"][data-chip="${type}"]`);
  if (chipEl) chipEl.classList.toggle('active', list.includes(type));
}

function scrollToSec(id) {

}

function computeIssues() {
  const issues = [];
  POSITIONS.forEach(p => {
    if (state.tyres[p.k].status === 'fail') issues.push(`Tyres: ${p.n} failed inspection`);
    if (state.rims[p.k].status === 'fail') issues.push(`Rims: ${p.n} damaged/failed`);
  });
  ['FR','FL','RR','RL'].forEach(k => {
    if (state.brakes[k].pads === 'fail') issues.push(`Brakes: ${k} pads worn out`);
    if (state.brakes[k].disc === 'fail') issues.push(`Brakes: ${k} disc damaged`);
  });
  if (state.suspension.front.status === 'fail') issues.push(`Suspension: Front suspension defect detected`);
  if (state.suspension.rear.status === 'fail') issues.push(`Suspension: Rear suspension defect detected`);
  
  Object.entries(state.intext).forEach(([k,v]) => { if(v.status === 'fail') issues.push(`Interior/Exterior: ${k}`); });
  Object.entries(state.electrical).forEach(([k,v]) => { if(v.status === 'fail') issues.push(`Electrical: ${k}`); });
  Object.entries(state.engine).forEach(([k,v]) => { if(v.status === 'fail') issues.push(`Engine: ${k}`); });
  Object.entries(state.transmission).forEach(([k,v]) => { if(v.status === 'fail') issues.push(`Transmission: ${k}`); });
  Object.entries(state.chassis).forEach(([k,v]) => { if(v.status === 'fail') issues.push(`Chassis: ${k}`); });
  Object.entries(state.body).forEach(([k,v]) => {
    if(v.damage.length > 0) issues.push(`Body Panel ${k}: ${v.damage.join(', ')}`);
  });
  return issues;
}

/* Optimized image conversion with client-side canvas compression */
function fileToDataURL(file, cb) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      const MAX_DIM = 1200;
      if (width > MAX_DIM || height > MAX_DIM) {
        if (width > height) {
          height = Math.round((height * MAX_DIM) / width);
          width = MAX_DIM;
        } else {
          width = Math.round((width * MAX_DIM) / height);
          height = MAX_DIM;
        }
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => cb(e.target.result);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  document.getElementById('railNav').innerHTML = navHtml;

}

function renderProgress(){
  let total=0, done=0, pass=0, fail=0;
  function tally(rec, statField){ total++; const v=rec[statField]; if(v && v!=='pending'){done++; if(v==='pass'||v==='checked')pass++; if(v==='fail'||v==='damaged')fail++;} }
  POSITIONS.forEach(p=>{ tally(state.tyres[p.k],'status'); tally(state.rims[p.k],'status'); });
  ['FR','FL','RR','RL'].forEach(k=>{ tally(state.brakes[k],'pads'); tally(state.brakes[k],'disc'); });
  tally(state.suspension.front,'status'); tally(state.suspension.rear,'status');
  Object.values(state.intext).forEach(r=>tally(r,'status'));
  Object.values(state.electrical).forEach(r=>tally(r,'status'));
  Object.values(state.engine).forEach(r=>tally(r,'status'));
  Object.values(state.transmission).forEach(r=>tally(r,'status'));
  Object.values(state.chassis).forEach(r=>tally(r,'status'));

  const pct = total? Math.round(done/total*100) : 0;
  const barText = pct+'% checked ('+done+'/'+total+')';
  
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('progressLbl').textContent = barText;
  
  if (document.getElementById('mobileProgressBar')) {
    document.getElementById('mobileProgressBar').style.width = pct+'%';
    document.getElementById('mobileProgressLbl').textContent = barText;
  }

  SECTIONS.forEach(s=>{
    const el = document.getElementById('nav-'+s.id);
    if(el) el.classList.toggle('done', false);
  });
  return {total, done, pass, fail};
}

/* =========================================================================

function pill(status){
  const map = {pass:'PASS',fail:'FAIL',na:'N/A',checked:'CHECKED',repaired:'REPAIRED',damaged:'DAMAGED',pending:'PENDING'};
  const cls = status==='pending' ? 'na' : status;
  return `<span class="pg-pill ${cls}">${map[status]||status}</span>`;
}
function ph(url, alt){ return url ? `<img class="ph" src="${url}" alt="${alt||''}">` : `<div class="ph" style="display:flex;align-items:center;justify-content:center;color:#a8a8ac;font-size:10px;">No photo</div>`; }

function printReport() {
  const root = document.getElementById('pdfRoot');
  root.innerHTML = buildPdfHTML();
  document.body.classList.add('printing-pdf-root');
  
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.body.classList.remove('printing-pdf-root');
      root.innerHTML = '';
    }, 500);
  }, 200);
}

function generatePDF(){
  const btn = document.getElementById('pdfBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Building report…'; 
  btn.disabled = true;

  showAlert('Generating PDF Report', 'Please wait while your vehicle inspection report is compiled...');

  const root = document.getElementById('pdfRoot');
  root.innerHTML = buildPdfHTML();

  root.style.display = 'block';
  root.style.position = 'fixed';
  root.style.top = '0';
  root.style.left = '0';
  root.style.zIndex = '100000';
  root.style.background = '#ffffff';

  setTimeout(() => {
    const vin = (state.meta.vin || 'VEHICLE').replace(/[^a-zA-Z0-9]/g,'');
    const dateStr = (state.meta.date || new Date().toISOString().slice(0,10));
    const filename = `Fixanycars_PPI_${vin}_${dateStr}.pdf`;

    const opt = {
      margin: 0,
      filename: filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        logging: false,
        scrollX: 0,
        scrollY: 0,
        windowWidth: 794
      },
      jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    };

    html2pdf().set(opt).from(root).save().then(() => {
      root.style.display = 'none';
      root.innerHTML = '';
      btn.innerHTML = originalText;
      btn.disabled = false;
      closeModal();
    }).catch((e) => {
      console.error('PDF generation error:', e);
      root.style.display = 'none';
      root.innerHTML = '';
      btn.innerHTML = originalText;
      btn.disabled = false;
      closeModal();
      showAlert('PDF Export Error', 'Could not generate PDF download. Please click "Print Report" to save or print directly.');
    });
  }, 400);
}
